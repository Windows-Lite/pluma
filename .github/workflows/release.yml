name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: src/sdk
          key: webview2-sdk-v1
      - name: Version
        id: v
        shell: bash
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$last" ]; then v=v1.0.0; range="--max-count=20 HEAD"
          else IFS=. read -r a b c <<< "${last#v}"; v="v$a.$b.$((c+1))"; range="$last..HEAD"; fi
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          { echo "notes<<EOF"; git log --pretty='- %s' $range; echo EOF; } >> "$GITHUB_OUTPUT"
      - name: App identifiers
        # the Google Drive client (sync.cpp) from the repo's secrets, into a header that is never committed
        shell: pwsh
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if ($env:GOOGLE_CLIENT_ID) {
            "#define PLUMA_GOOGLE_CLIENT_ID L`"$env:GOOGLE_CLIENT_ID`"`n#define PLUMA_GOOGLE_CLIENT_SECRET L`"$env:GOOGLE_CLIENT_SECRET`"" | Set-Content -Encoding ascii src\secrets.h
          }
      - name: Build
        # the version goes into the exe, for its updates (update.cpp)
        shell: cmd
        env:
          PLUMA_VERSION: ${{ steps.v.outputs.tag }}
        run: src\compilar.cmd "%GITHUB_WORKSPACE%\Pluma.exe"
      - name: Package
        # one top folder, as instalar.ps1 and the windows-lite lab expect
        shell: pwsh
        run: |
          $d = "pluma-${{ steps.v.outputs.tag }}"
          New-Item -ItemType Directory "$d\tools" | Out-Null
          Copy-Item Pluma.exe, instalar.ps1, README.md $d
          Copy-Item extensiones, fuentes "$d" -Recurse
          Copy-Item tools\motor-video.ps1 "$d\tools"
          # third-party code inside Pluma.exe: its license goes with it
          New-Item -ItemType Directory "$d\licencias" | Out-Null
          Copy-Item src\readability\LICENSE.md "$d\licencias\readability-LICENSE.md"
          Copy-Item src\monocypher\LICENCE.md "$d\licencias\monocypher-LICENCE.md"
          Compress-Archive $d "$d.zip"
          # "<sha256>  <file>": Pluma checks the download against it before updating
          "$((Get-FileHash "$d.zip" -Algorithm SHA256).Hash.ToLower())  $d.zip" | Set-Content -NoNewline -Encoding ascii "$d.zip.sha256"
      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.v.outputs.notes }}
        run: gh release create "${{ steps.v.outputs.tag }}" "pluma-${{ steps.v.outputs.tag }}.zip" "pluma-${{ steps.v.outputs.tag }}.zip.sha256" --target "$GITHUB_SHA" --title "Pluma ${{ steps.v.outputs.tag }}" --notes "$NOTES"
