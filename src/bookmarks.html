<!doctype html>
<!-- Pluma's bookmarks manager (pluma://bookmarks), inside the exe; bookmarks.cpp serves it and answers its messages.
     Written in Spanish, as the code: Pluma sends each text in the chosen language (data-t, T()). -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marcadores</title>
<style>
:root { --bg:#f7f7f9; --card:#fff; --text:#1b1b1f; --sub:#5f6168; --line:#e2e3e8; --hover:#ededf1; --accent:#2f6fed; --accent-soft:#e6eefe; --danger:#c4314b; --field:#fff; color-scheme:light; }
:root.dark { --bg:#1c1d21; --card:#26272c; --text:#ececf0; --sub:#a3a5ad; --line:#36373d; --hover:#303137; --accent:#6d9cff; --accent-soft:#2a3550; --danger:#ff6b81; --field:#1f2025; color-scheme:dark; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body { background:var(--bg); color:var(--text); font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; }
header { display:flex; align-items:center; gap:12px; padding:18px 26px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; }
header h1 { font-size:22px; font-weight:600; margin:0; flex:none; }
.search { position:relative; flex:1; max-width:360px; }
.search input { width:100%; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--field); color:var(--text); font:inherit; padding:0 12px 0 34px; outline:none; }
.search input:focus { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.search svg { position:absolute; left:10px; top:9px; width:16px; height:16px; fill:var(--sub); }
.spacer { flex:1; }
button { font:inherit; color:var(--text); height:32px; padding:0 14px; border-radius:6px; border:1px solid var(--line); background:var(--field); cursor:default; }
button:hover { background:var(--hover); }
button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
.wrap { display:flex; height:calc(100% - 71px); }
nav { width:260px; flex:none; border-right:1px solid var(--line); overflow-y:auto; padding:10px 8px; }
.fold { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:8px; cursor:default; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.fold:hover { background:var(--hover); }
.fold.on { background:var(--accent-soft); }
.fold svg { width:16px; height:16px; fill:none; stroke:currentColor; stroke-width:1.6; flex:none; }
main { flex:1; overflow-y:auto; padding:16px 26px 60px; }
.toolbar { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
.toolbar .where { font-weight:600; font-size:16px; flex:1; }
label.toggle { display:flex; align-items:center; gap:8px; color:var(--sub); font-size:13px; }
.list { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
.item { display:flex; align-items:center; gap:12px; padding:10px 14px; }
.item + .item { border-top:1px solid var(--line); }
.item:hover { background:var(--hover); }
.item .ic { width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:1.6; color:var(--sub); }
.item img { width:16px; height:16px; flex:none; }
.item .t { flex:1; min-width:0; overflow:hidden; }
.item .t .n { font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item .t .u { color:var(--sub); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.item .acts { display:none; gap:6px; flex:none; }
.item:hover .acts { display:flex; }
.item .acts button, .item .acts select { height:28px; }
.item.folder .n { cursor:default; }
.empty { color:var(--sub); padding:40px 0; text-align:center; }
.badge { font-size:11px; color:var(--sub); border:1px solid var(--line); border-radius:10px; padding:1px 7px; margin-left:6px; }
</style>
</head>
<body>
<header>
  <h1 data-t="Marcadores">Marcadores</h1>
  <div class="search"><svg viewBox="0 0 16 16"><path d="M6.5 1a5.5 5.5 0 0 1 4.38 8.83l3.65 3.64a.75.75 0 0 1-1.06 1.06l-3.64-3.65A5.5 5.5 0 1 1 6.5 1Zm0 1.5a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/></svg><input id="q" type="search" data-tp="Buscar en los marcadores" placeholder="Buscar en los marcadores" autocomplete="off"></div>
  <div class="spacer"></div>
  <label class="toggle"><input type="checkbox" id="bar"><span data-t="Barra de marcadores">Barra de marcadores</span></label>
  <button id="import" data-t="Importar de otro navegador">Importar de otro navegador</button>
</header>
<div class="wrap">
  <nav id="nav"></nav>
  <main>
    <div class="toolbar"><div class="where" id="where"></div><button id="newfolder" data-t="Nueva carpeta">Nueva carpeta</button></div>
    <div class="list" id="list"></div>
  </main>
</div>
<script>
const W = window.chrome && chrome.webview;
const $ = id => document.getElementById(id);
let S = null, texts = {}, sel = 0, open = {};
const tr = s => texts[s] || s;
const send = o => W && W.postMessage(o);
const ICF = '<svg class="ic" viewBox="0 0 20 20"><path d="M3 6a2 2 0 0 1 2-2h3l2 2h5a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>';
const ICU = '<svg class="ic" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M2.5 10h15M10 2.5a11 11 0 0 1 0 15M10 2.5a11 11 0 0 0 0 15"/></svg>';

function translate() {
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = tr(e.dataset.t));
  document.querySelectorAll('[data-tp]').forEach(e => e.placeholder = tr(e.dataset.tp));
  document.title = tr('Marcadores');
}
function walk(node, fn, depth = 0, parent = null) { if (node.folder) (node.kids || []).forEach(k => { fn(k, depth, node); walk(k, fn, depth + 1, node); }); }
function findNode(id, node = S.tree) { if (node.id === id) return node; for (const k of node.kids || []) { const r = findNode(id, k); if (r) return r; } return null; }
function allFolders() { const out = []; walk(S.tree, (n, d) => { if (n.folder) out.push({ id: n.id, title: n.title, depth: d }); }); return out; }

function renderNav() {
  const nav = $('nav'); nav.textContent = '';
  const row = (n, depth) => {
    const d = document.createElement('div');
    d.className = 'fold' + (n.id === sel ? ' on' : '');
    d.style.paddingLeft = (10 + depth * 16) + 'px';
    d.innerHTML = '<svg viewBox="0 0 20 20"><path d="M3 6a2 2 0 0 1 2-2h3l2 2h5a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg><span></span>';
    d.querySelector('span').textContent = n.title;
    d.onclick = () => { sel = n.id; render(); };
    nav.append(d);
  };
  (S.tree.kids || []).forEach(n => { if (n.folder) { row(n, 0); walk(n, (k, dd) => { if (k.folder) row(k, dd + 1); }, 0); } });
}
function render() {
  document.documentElement.classList.toggle('dark', S.dark);
  document.documentElement.lang = S.lang;
  $('bar').checked = S.bar;
  if (!findNode(sel)) sel = S.pinsFolder;
  renderNav();
  const q = $('q').value.trim().toLowerCase();
  const list = $('list'); list.textContent = '';
  let items, folderName;
  if (q) {
    items = []; walk(S.tree, n => { if (!n.folder && (n.title.toLowerCase().includes(q) || n.url.toLowerCase().includes(q))) items.push(n); });
    folderName = tr('Resultados');
  } else {
    const f = findNode(sel) || S.tree; folderName = f.title; items = f.kids || [];
  }
  $('where').textContent = folderName;
  $('newfolder').style.display = q ? 'none' : '';
  if (!items.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = tr('No hay nada aquí'); list.append(e); return; }
  const folders = allFolders();
  for (const n of items) {
    const row = document.createElement('div');
    row.className = 'item' + (n.folder ? ' folder' : '');
    const t = document.createElement('div'); t.className = 't';
    const nm = document.createElement('div'); nm.className = 'n'; nm.textContent = n.title || n.url;
    t.append(nm);
    if (!n.folder) { const u = document.createElement('div'); u.className = 'u'; u.textContent = n.url; t.append(u); row.append(ico(false)); }
    else row.append(ico(true));
    row.append(t);
    const acts = document.createElement('div'); acts.className = 'acts';
    if (n.role === 0) {
      const mv = document.createElement('select');
      const o0 = document.createElement('option'); o0.textContent = tr('Mover a...'); o0.value = ''; mv.append(o0);
      for (const f of folders) { if (f.id === n.id) continue; const o = document.createElement('option'); o.value = f.id; o.textContent = '\u00a0\u00a0\u00a0'.repeat(f.depth) + f.title; mv.append(o); }
      mv.onchange = () => { if (mv.value) send({ op: 'move', id: n.id, parent: +mv.value, at: 0 }); };
      acts.append(mv);
      const rn = document.createElement('button'); rn.textContent = tr('Renombrar'); rn.onclick = () => { const v = prompt(tr('Nuevo nombre'), n.title); if (v) send({ op: 'rename', id: n.id, title: v }); }; acts.append(rn);
      const rm = document.createElement('button'); rm.textContent = tr('Quitar'); rm.onclick = () => send({ op: 'remove', id: n.id }); acts.append(rm);
    } else { const b = document.createElement('span'); b.className = 'badge'; b.textContent = tr('fija'); acts.append(b); }
    row.append(acts);
    if (!n.folder) { row.ondblclick = () => send({ op: 'open', url: n.url }); nm.onclick = () => send({ op: 'open', url: n.url }); nm.style.cursor = 'pointer'; }
    else nm.onclick = () => { sel = n.id; render(); };
    list.append(row);
  }
}
function ico(folder) { const d = document.createElement('div'); d.innerHTML = folder ? ICF : ICU; return d.firstChild; }
$('q').addEventListener('input', render);
$('bar').onchange = e => send({ op: 'bar', on: e.target.checked });
$('import').onclick = () => send({ op: 'import' });
$('newfolder').onclick = () => { const v = prompt(tr('Nombre de la carpeta'), tr('Nueva carpeta')); if (v) send({ op: 'addFolder', parent: sel, title: v }); };
function ask() {
  const all = new Set();
  document.querySelectorAll('[data-t]').forEach(e => all.add(e.dataset.t));
  document.querySelectorAll('[data-tp]').forEach(e => all.add(e.dataset.tp));
  ['Resultados', 'No hay nada aquí', 'Mover a...', 'Renombrar', 'Quitar', 'Nuevo nombre', 'Nombre de la carpeta', 'fija'].forEach(s => all.add(s));
  send({ op: 'get', texts: [...all] });
}
if (W) W.addEventListener('message', e => { const m = e.data; if (!m || m.op !== 'state') return; if (m.t) { texts = m.t; translate(); } S = m; if (!sel) sel = S.pinsFolder; render(); });
ask();
</script>
</body>
</html>
