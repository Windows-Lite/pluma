<!doctype html>
<!-- Pluma's light YouTube Music page (lite.cpp serves it at YouTube Music's own addresses, inside the exe). It asks
     YouTube Music's API (/youtubei/v1, client WEB_REMIX, as its page and ytmusicapi do) with the person's cookies,
     and draws the answer. The music plays in Pluma's player, sound only (video.cpp, "sound only"): Pluma asks
     __pluma.music() four times a second. The page moves between its views with history.pushState and never loads
     again, so the music goes on. Written in Spanish, as the code: Pluma writes the texts in the chosen language into
     CFG.t (t('...')). Anything that fails goes to YouTube Music's own page (pluma_normal=1). -->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>YouTube Music</title>
<link rel="icon" href="/favicon.ico">

<style>

.shelf { display: grid; grid-auto-flow: column; grid-auto-columns: 176px; gap: 18px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: thin; }
.card { cursor: pointer; min-width: 0; }

.card .th img { width: 100%; height: 100%; object-fit: cover; }

.card .sub { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rows { display: grid; gap: 2px; }

.trk { display: flex; align-items: center; gap: 12px; padding: 6px 8px; border-radius: 10px; cursor: pointer; min-width: 0; }

#queue h3 { margin: 6px 8px 8px; font-size: 16px; }

  border-radius: 10px; z-index: 7; display: none; }
#toast.on { display: block; }

</style>
</head>

<script>
// PARSER: YouTube Music's answers -> plain objects (no page here: tools/music-test.js runs this part alone)
const txt = (x) => !x ? '' : typeof x === 'string' ? x : x.simpleText != null ? x.simpleText : Array.isArray(x.runs) ? x.runs.map((r) => r.text || '').join('') : '';
function find(o, key, depth = 0) {
  if (!o || typeof o !== 'object' || depth > 40) return undefined;
  if (Object.prototype.hasOwnProperty.call(o, key)) return o[key];
  for (const k in o) { const r = find(o[k], key, depth + 1); if (r !== undefined) return r; }
  return undefined;

const fixUrl = (u) => !u ? '' : u.startsWith('//') ? 'https:' + u : u;

  const l = find(th || {}, 'thumbnails') || [];
  if (!l.length) return '';
  const ok = l.find((x) => (x.width || 0) >= (want || 226));
  return fixUrl((ok || l[l.length - 1]).url || '');

const pageType = (ep) => (((ep || {}).browseEndpointContextSupportedConfigs || {}).browseEndpointContextMusicConfig || {}).pageType || '';
function browseUrl(ep) {
  // where a browse goes, as an address of YouTube Music's own (so a reload, a new tab or "normal" land there too)
  const id = (ep && ep.browseId) || '';
  if (!id) return '';
  if (id.startsWith('VL')) return '/playlist?list=' + encodeURIComponent(id.slice(2));
  if (id.startsWith('UC')) return '/channel/' + encodeURIComponent(id);

}
function people(runs) {
  // the artists and the album of a subtitle's runs (linked), and the plain rest
  const out = { artists: [], album: null, rest: [] };
  for (const r of runs || []) {
    const b = (r.navigationEndpoint || {}).browseEndpoint;
    const pt = pageType(b);
    if (b && (pt === 'MUSIC_PAGE_TYPE_ARTIST' || pt === 'MUSIC_PAGE_TYPE_USER_CHANNEL')) out.artists.push({ name: r.text, url: browseUrl(b) });
    else if (b && pt === 'MUSIC_PAGE_TYPE_ALBUM') out.album = { name: r.text, url: browseUrl(b) };
    else if (r.text && r.text.trim() && r.text.trim() !== '•' && r.text.trim() !== '&') out.rest.push(r.text.trim());
  }
  return out;
}
function kindOf(watch, browse, playlistWatch) {
  if (browse) {
    const pt = pageType(browse);
    if (pt === 'MUSIC_PAGE_TYPE_ALBUM' || pt === 'MUSIC_PAGE_TYPE_AUDIOBOOK') return 'album';
    if (pt === 'MUSIC_PAGE_TYPE_ARTIST' || pt === 'MUSIC_PAGE_TYPE_USER_CHANNEL' || pt === 'MUSIC_PAGE_TYPE_LIBRARY_ARTIST') return 'artist';
    if (pt === 'MUSIC_PAGE_TYPE_PLAYLIST') return 'playlist';
    return 'other';
  }
  if (playlistWatch) return 'mix';
  if (watch && watch.videoId) {
    const vt = ((watch.watchEndpointMusicSupportedConfigs || {}).watchEndpointMusicConfig || {}).musicVideoType || '';
    return /ATV|PRIVATELY_OWNED/.test(vt) || !vt ? 'song' : 'video';
  }

}
function fromTwoRow(r) {
  // a card (musicTwoRowItemRenderer): an album, a playlist, an artist, a mix, a song or a video
  const ep = r.navigationEndpoint || {};
  const titleRun = ((r.title || {}).runs || [])[0] || {};
  const browse = ep.browseEndpoint || (titleRun.navigationEndpoint || {}).browseEndpoint;
  const watch = ep.watchEndpoint || (titleRun.navigationEndpoint || {}).watchEndpoint;
  const pw = ep.watchPlaylistEndpoint;
  const kind = kindOf(watch, browse, pw);
  if (kind === 'other') return null;
  const p = people((r.subtitle || {}).runs);
  return { kind, title: txt(r.title), sub: txt(r.subtitle), artists: p.artists, album: p.album, thumb: thumb(r.thumbnailRenderer),
           url: browse ? browseUrl(browse) : '', videoId: (watch || {}).videoId || '', playlistId: (pw || watch || {}).playlistId || '' };
}
function fromRow(r) {
  // a row (musicResponsiveListItemRenderer): a song or a video of a list, a search result of any kind
  const cols = (r.flexColumns || []).map((c) => ((c.musicResponsiveListItemFlexColumnRenderer || {}).text || {}).runs || []);
  const first = (cols[0] || [])[0] || {};
  const ov = find(r.overlay || {}, 'playNavigationEndpoint') || {};
  const watch = (first.navigationEndpoint || {}).watchEndpoint || ov.watchEndpoint;
  const browse = (r.navigationEndpoint || {}).browseEndpoint;
  const videoId = ((r.playlistItemData || {}).videoId) || (watch || {}).videoId || '';
  const kind = browse ? kindOf(null, browse) : videoId ? kindOf(watch || { videoId }, null) : (ov.watchPlaylistEndpoint ? 'mix' : 'other');
  if (kind === 'other' && !videoId) return null;
  const subRuns = [].concat(...cols.slice(1));
  const p = people(subRuns);
  const subText = cols.slice(1).map((c) => c.map((x) => x.text).join('')).filter(Boolean).join(' • ');
  const dur = txt(((r.fixedColumns || [])[0] || {}).musicResponsiveListItemFixedColumnRenderer && r.fixedColumns[0].musicResponsiveListItemFixedColumnRenderer.text) ||
              (p.rest.find((x) => /^\d+:\d\d(:\d\d)?$/.test(x)) || '');
  return { kind: kind === 'other' ? 'song' : kind, title: cols[0].map((x) => x.text).join(''), sub: subText, artists: p.artists, album: p.album,
           thumb: thumb(r.thumbnail, 60), url: browse ? browseUrl(browse) : '', videoId: browse ? '' : videoId, duration: dur,
           playlistId: (ov.watchPlaylistEndpoint || watch || {}).playlistId || '', unplayable: r.musicItemRendererDisplayPolicy === 'MUSIC_ITEM_RENDERER_DISPLAY_POLICY_GREY_OUT' };
}
function items(list) {
  const out = [];
  for (const x of list || []) {
    const it = x.musicTwoRowItemRenderer ? fromTwoRow(x.musicTwoRowItemRenderer) : x.musicResponsiveListItemRenderer ? fromRow(x.musicResponsiveListItemRenderer) : null;
    if (it) out.push(it);
  }
  return out;
}
function contOf(list, shelf) {
  // the token for more of a list: a continuationItemRenderer at its end, or the shelf's old nextContinuationData
  const last = (list || [])[(list || []).length - 1];
  const c = last && last.continuationItemRenderer && find(last.continuationItemRenderer, 'continuationCommand');
  if (c && c.token) return { body: c.token };

  return n && n.continuation ? { ctoken: n.continuation } : null;

function shelves(contents) {

  const out = [];
  for (const s of contents || []) {
    const c = s.musicCarouselShelfRenderer || s.musicImmersiveCarouselShelfRenderer;
    if (c) {
      const h = (c.header || {}).musicCarouselShelfBasicHeaderRenderer || (c.header || {}).musicImmersiveCarouselShelfBasicHeaderRenderer || {};
      const its = items(c.contents);
      const rows = (c.contents || []).some((x) => x.musicResponsiveListItemRenderer);
      if (its.length) out.push({ kind: rows ? 'rows' : 'cards', title: txt(h.title) || txt(h.strapline), items: its });
      continue;
    }
    const m = s.musicShelfRenderer || s.musicPlaylistShelfRenderer;
    if (m) {
      const its = items(m.contents);
      if (its.length) out.push({ kind: 'list', title: txt(m.title), items: its, cont: contOf(m.contents, m), playlistId: m.playlistId || '' });
      continue;
    }
    const card = s.musicCardShelfRenderer;
    if (card) {
      const titleRun = ((card.title || {}).runs || [])[0] || {};
      const ep = titleRun.navigationEndpoint || {};
      const p = people((card.subtitle || {}).runs);
      const kind = kindOf(ep.watchEndpoint, ep.browseEndpoint, ep.watchPlaylistEndpoint);
      const top = kind === 'other' ? null : { kind, title: txt(card.title), sub: txt(card.subtitle), artists: p.artists, album: p.album, thumb: thumb(card.thumbnail),
                                             url: ep.browseEndpoint ? browseUrl(ep.browseEndpoint) : '', videoId: (ep.watchEndpoint || {}).videoId || '', playlistId: '' };
      const rest = items(card.contents);
      out.push({ kind: 'top', title: txt(((card.header || {}).musicCardShelfHeaderBasicRenderer || {}).title), items: (top ? [top] : []).concat(rest) });
      continue;
    }
    const is = s.itemSectionRenderer;
    if (is) {
      // (search answers: one result per section; together, one list)
      const its = items(is.contents);
      const last = out[out.length - 1];
      if (last && last.kind === 'list' && last.merged) last.items.push(...its);
      else if (its.length) out.push({ kind: 'list', title: '', items: its, merged: true });
      continue;
    }
    const g = s.gridRenderer;
    if (g) { const its = items(g.items); if (its.length) out.push({ kind: 'grid', title: txt(find(g.header || {}, 'title')), items: its, cont: contOf(g.items, g) }); continue; }

    if (d) out.push({ kind: 'text', title: txt(d.header), text: txt(d.description) });

}
function sectionList(j) {
  const sc = (j.contents || {}).singleColumnBrowseResultsRenderer;
  const tabs = (sc || (j.contents || {}).twoColumnBrowseResultsRenderer || {}).tabs || [];
  return find(((tabs[0] || {}).tabRenderer || {}).content || {}, 'sectionListRenderer') || null;
}
function parseHome(j) {
  const sl = sectionList(j);
  if (!sl) throw new Error('inicio sin secciones');
  return { shelves: shelves(sl.contents), cont: contOf(sl.contents, sl) };
}
function parseMore(j) {
  // a continuation's sections (home) or rows (a list)
  const sc = (j.continuationContents || {}).sectionListContinuation;

  const ms = (j.continuationContents || {}).musicShelfContinuation || (j.continuationContents || {}).musicPlaylistShelfContinuation || (j.continuationContents || {}).gridContinuation;
  if (ms) { const list = ms.contents || ms.items; return { items: items(list), cont: contOf(list, ms) }; }

  if (list.some((x) => x.musicCarouselShelfRenderer || x.musicShelfRenderer)) return { shelves: shelves(list), cont: contOf(list) };

}
function parseSearch(j) {

  const sl = find(((tabs[0] || {}).tabRenderer || {}).content || {}, 'sectionListRenderer');
  if (!sl) throw new Error('búsqueda sin resultados');
  return { shelves: shelves(sl.contents).filter((s) => s.items && s.items.length) };

function parseHeader(h) {
  if (!h) return null;

  if (!r) return null;
  const play = find(r.buttons || r.playButton || r.startRadioButton || r.menu || {}, 'playNavigationEndpoint') || {};
  const radio = find(r.startRadioButton || {}, 'watchPlaylistEndpoint') || find(r.menu || {}, 'watchPlaylistEndpoint') || null;
  const by = people(((r.straplineTextOne || {}).runs) || []);
  return { title: txt(r.title), sub: txt(r.subtitle), second: txt(r.secondSubtitle), artists: by.artists, thumb: thumb(r.thumbnail || r.foregroundThumbnail, 400),
           desc: txt(find(r.description || {}, 'description')) || txt(r.description), playlistId: ((play.watchPlaylistEndpoint || play.watchEndpoint || {}).playlistId) || '',
           radio: radio ? radio.playlistId : '', artist: !!(h.musicImmersiveHeaderRenderer || h.musicVisualHeaderRenderer) };

function parseBrowse(j) {

  // songs on the other), the library
  const two = (j.contents || {}).twoColumnBrowseResultsRenderer;
  if (two) {
    const main = find(((two.tabs || [])[0] || {}).tabRenderer || {}, 'sectionListRenderer') || {};

function parseQueue(j) {

  const out = [];
  for (const x of p.contents || []) {

    if (!r || !r.videoId) continue;

function parseSuggest(j) {
  const out = [];

}
// PARSER_FIN
if (typeof module !== 'undefined') module.exports = { items, shelves, parseHome, parseMore, parseSearch, parseBrowse, parseQueue, parseSuggest };

// ---------------------------------------------------------------- YouTube Music's API, as its page calls it
const ORIGIN = 'https://music.youtube.com';
// its version is the date (ytmusicapi does the same): yesterday's, in case the clock is ahead
const CV = '1.' + new Date(Date.now() - 86400000).toISOString().slice(0, 10).replace(/-/g, '') + '.01.00';
const signedIn = () => !!cookies().SAPISID;
async function sha1(s) {

}
async function authHeader() {
  const c = cookies(), ts = Math.floor(Date.now() / 1000), parts = [];
  for (const [name, label] of [['SAPISID', 'SAPISIDHASH'], ['__Secure-1PAPISID', 'SAPISID1PHASH'], ['__Secure-3PAPISID', 'SAPISID3PHASH']])
    if (c[name]) parts.push(label + ' ' + ts + '_' + await sha1(ts + ' ' + c[name] + ' ' + ORIGIN));

}
async function api(ep, body, query) {

    dragging = false;
    const it = Q.list[Q.index], dur = (Q.state && Q.state.dur) || (it && it.length) || 0;
    if (dur > 0) Q.cmds.push({ op: 'seek', s: $('bseek').value / 1000 * dur });
  });
  const vol = () => { store.set('mvolume', String(Q.volume)); store.set('mmuted', Q.muted ? '1' : '0'); Q.cmds.push({ op: 'volume', v: Q.volume, muted: Q.muted }); drawBar(); };
  $('bvol').addEventListener('input', () => { Q.volume = +$('bvol').value; Q.muted = false; vol(); });
  $('bmute').addEventListener('click', () => { Q.muted = !Q.muted; vol(); });
  $('bq').addEventListener('click', () => { $('queue').classList.toggle('on'); $('bq').classList.toggle('on'); drawQueue(); });
  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input, textarea') && e.target.type !== 'range') return;
    if (e.key === ' ' || e.key === 'k') { if (Q.list.length) { e.preventDefault(); $('bplay').click(); } }
    else if (e.key === 'n' && e.shiftKey) next(false);
    else if (e.key === 'p' && e.shiftKey) prev();
  });
}
window.__pluma = {
  // Pluma asks this four times a second: what its player is doing (null: nothing of this page), and what to do
  music(s) {
    const was = Q.state;
    Q.state = s;
    if (s && s.id === Q.id) {
      if (s.error && Q.want) { songFailed(Q.id, s.error); }
      else if (s.ended && Q.want && !(was && was.ended)) { Q.failRun = 0; next(true); }
      else if (!s.loading && s.pos > 0.5) Q.failRun = 0;
    } else if (!s && Q.want && Q.asking && Date.now() - Q.asking > 4000 && !Q.cmds.length) {
      // the music was taken by another tab (or Pluma closed it): stopped here
      Q.want = false; Q.asking = 0;
    }
    if (s && s.id === Q.id) Q.asking = 0;
    drawBar();
    const c = Q.cmds; Q.cmds = [];
    return c;
  },
  state: () => ({ id: Q.id, index: Q.index, size: Q.list.length, want: Q.want, s: Q.state, view: P() }),   // (tests)
};

// ---------------------------------------------------------------- the bar on top
function bar() {
  $('lite').textContent = t('ligero');
  $('q').placeholder = t('Buscar canciones, álbumes, artistas');
  normalButton($('normal'), t('YouTube Music normal'), t('Abre esta página en el YouTube Music de siempre, en esta pestaña'));
  if (!signedIn()) { $('login').hidden = false; $('login').textContent = t('Iniciar sesión'); $('login').href = loginUrl(); }
  $('links').innerHTML = [['/', t('Inicio')], ['/library', t('Biblioteca')]].map(([u, n]) => `<a href="${u}">${esc(n)}</a>`).join('');
  $('sf').addEventListener('submit', (e) => {
    e.preventDefault();
    const q = $('q').value.trim();
    if (q) go('/search?q=' + encodeURIComponent(q));
  });
}
bar();
wire();
route();
</script>
