<!doctype html><meta charset="utf-8"><title>Entrar</title><link rel="stylesheet" href="style.css">
<h1>Entrar</h1>
<form id="login" method="post" action="created">
  <input name="email" id="email" type="email" placeholder="Correo" autocomplete="username">
  <input name="password" id="pw" type="password" placeholder="Contraseña">
  <button type="submit">Iniciar sesión</button>
</form>
