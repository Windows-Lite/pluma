<!doctype html><meta charset="utf-8"><title>Crear cuenta</title><link rel="stylesheet" href="style.css">
<h1>Crear cuenta</h1>
<form id="signup" method="post" action="created">
  <input name="email" type="email" placeholder="Correo" autocomplete="username" value="ana@example.com">
  <input name="password" id="pw" type="password" placeholder="Contraseña">
  <input name="password_confirm" id="pw2" type="password" placeholder="Repite la contraseña">
  <button type="submit">Crear cuenta</button>
</form>
