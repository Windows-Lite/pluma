<!doctype html><meta charset="utf-8"><title>Registro (CSP estricta)</title><link rel="stylesheet" href="style.css">
<h1>Registro con CSP y Trusted Types</h1>
<form method="post" action="created">
  <input name="email" type="email" autocomplete="username" placeholder="Correo">
  <input name="new-password" id="pw" type="password" autocomplete="new-password" placeholder="Contraseña">
  <button type="submit">Registrarse</button>
</form>
