<!doctype html>
<meta charset="utf-8">
<title>Popup test page</title>
<style>body { font: 16px system-ui; margin: 40px; background: #1b1b20; color: #eee } input { font-size: 24px; width: 260px; padding: 8px; margin: 8px 0 }</style>
<h1>Enter Security Code</h1>
<input id="code" name="otp" autocomplete="one-time-code" placeholder="000000">
<p id="clicks">clicks: 0</p>
<script>
let n = 0;
document.addEventListener('mousedown', () => { document.getElementById('clicks').textContent = 'clicks: ' + ++n; });
</script>
